[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-agents"
version = "0.2.0"
description = "HelloAgents — Datawhale 第七/八章自建智能体框架（学习实现）"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0,<2.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
search = ["tavily-python", "google-search-results"]
# 第八章完整依赖（实现 8.2/8.3 时再装）
memory = [
    "qdrant-client",
    "neo4j",
    "spacy",
    "sentence-transformers",
    "markitdown",
    "pypdf",
]
web = ["gradio>=4.0.0"]
# 第十章 MCP（FastMCP 2.x）
protocols = ["fastmcp>=2.0.0"]
# 第十一章 Agentic RL
rl = [
    "trl>=0.24.0",
    "transformers>=4.20.0",
    "torch>=2.0.0",
    "datasets>=2.14.0",
    "accelerate>=0.20.0",
    "peft>=0.5.0",
    "bitsandbytes>=0.41.0",
    "wandb>=0.15.0",
    "tensorboard>=2.13.0",
]
# 第十二章评估（bfcl-eval / numpy 1.26 需另装，见 README）
evaluation = [
    "datasets>=2.14.0",
    "huggingface_hub>=0.20.0",
    "evaluate>=0.4.0,<1.0.0",
    "pandas>=2.0.0,<3.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<1.0.0",
    "tqdm>=4.65.0,<5.0.0",
    "gradio>=4.0.0,<5.0.0",
]
all = ["hello-agents[search,memory,web,protocols,rl,evaluation]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hello_agents*"]

[tool.ruff.lint.per-file-ignores]
"hello_agents/evaluation/**/*.py" = ["BLE001", "PLW1510"]
"hello_agents/tools/builtin/bfcl_evaluation_tool.py" = ["BLE001"]
"hello_agents/tools/builtin/gaia_evaluation_tool.py" = ["BLE001"]
"hello_agents/tools/builtin/llm_judge_tool.py" = ["BLE001"]
"hello_agents/tools/builtin/win_rate_tool.py" = ["BLE001"]
"code/chapter12/data_generation/**/*.py" = ["BLE001", "E402"]
